name: SnakeGame

on:
  push:
    paths:
      - "SnakeGame/**"
      - ".github/workflows/snakegame.yml"
  pull_request:
    paths:
      - "SnakeGame/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SnakeGame
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build and test
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: SnakeGame
          path: SnakeGame/target/SnakeGame-*.jar
